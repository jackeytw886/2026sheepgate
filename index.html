<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>祥雲迎賓門 燈光控制模擬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 控制模擬台：舞台鋪滿畫面；上方一排圖示，左右面板預設收起（邊緣大箭頭開啟，可拖曳、縮放、放大全螢幕）。朱紅＝操作重點，石綠＝電腦控制，琥珀＝手動。 */
:root{
  --bg:#07080b; --fg:#ece6da; --fg2:#b9b1a3; --fg3:#80796e; --line:rgba(236,230,218,.13); --line2:rgba(236,230,218,.24);
  --zhu:#e2563f; --zhu2:rgba(226,86,63,.2); --jade:#62b6a0; --jade2:rgba(98,182,160,.18); --amber:#e8a54b; --amber2:rgba(232,165,75,.18);
  --panel:17,16,14; --pa:.86; --ui:1;
  --f-disp:"LXGW WenKai TC","Kaiti TC","BiauKai","Noto Serif CJK TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;overflow:hidden}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--zhu);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
/* ---- 上方一排 ---- */
.top{flex:none;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 6px;background:rgba(var(--panel),.96);border-bottom:1px solid var(--line);font-size:calc(14px*var(--ui));position:relative;z-index:8}
.top>*{flex:none}
.brand{display:flex;align-items:center;gap:8px;margin-right:4px}
.seal{width:32px;height:32px;border-radius:5px;background:var(--zhu);color:#fff6f2;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:12px;line-height:1.02;text-align:center}
.brand b{font-family:var(--f-disp);font-size:1.12em;letter-spacing:.05em;font-weight:700;white-space:nowrap}
.ib{height:36px;min-width:36px;padding:0 8px;border:1px solid transparent;background:transparent;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;color:var(--fg)}
.ib:hover{background:rgba(255,255,255,.07);border-color:var(--line)}
.ib[aria-pressed="true"],.ib[aria-expanded="true"]{background:var(--zhu2);border-color:var(--zhu);color:#ffd9d0}
.ib.play{background:var(--zhu);color:#fff6f2;min-width:40px}
.ib.play:hover{background:#ef6650}
.ib .t{font-size:.86em}
.ib.txt{font-family:var(--f-mono);font-weight:600;font-size:.9em;min-width:42px}
.hd{font-family:var(--f-mono);font-weight:600;font-size:.78em;border:1.6px solid currentColor;border-radius:4px;padding:0 4px;line-height:1.35}
.vsep{width:1px;height:22px;background:var(--line2);margin:0 2px}
.tlx{flex:1 1 260px!important;min-width:170px;display:flex;align-items:center;gap:8px}
.tlmeta{display:flex;flex-direction:column;line-height:1.15;min-width:3.6em;text-align:right}
.tlmeta b{font-family:var(--f-mono);font-weight:500;font-size:.92em;font-variant-numeric:tabular-nums}
.tlmeta span{font-family:var(--f-disp);font-weight:700;color:var(--zhu);font-size:.95em}
.tltrack{position:relative;flex:1;height:30px;min-width:120px}
.bands{position:absolute;inset:0;display:flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden;pointer-events:none}
.band{flex-basis:0;border-right:1px solid var(--line);color:var(--fg3);font-size:.74em;display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;white-space:nowrap}
.band:last-child{border-right:0}
.band[aria-current="true"]{background:var(--zhu2);color:#ffd9d0}
.tlfill{position:absolute;left:1px;top:1px;bottom:1px;background:rgba(226,86,63,.16);border-radius:6px 0 0 6px;pointer-events:none}
#scrub{-webkit-appearance:none;appearance:none;position:absolute;inset:0;width:100%;height:100%;margin:0;background:transparent;cursor:pointer}
#scrub::-webkit-slider-runnable-track{height:30px;background:transparent}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:5px;height:30px;border-radius:3px;background:var(--zhu);box-shadow:0 0 8px rgba(226,86,63,.8)}
#scrub::-moz-range-track{background:transparent;height:30px}
#scrub::-moz-range-thumb{width:5px;height:28px;border:0;border-radius:3px;background:var(--zhu)}
/* ---- 舞台 ---- */
.main{position:relative;flex:1;min-height:0;font-size:calc(14px*var(--ui))}
.stagewrap{position:absolute;inset:0;overflow:hidden;background:#05070b;touch-action:none;cursor:grab}
.stagewrap.drag{cursor:grabbing}
.stagewrap.hot{cursor:pointer}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;display:block}
.capt{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:min(560px,62%);text-align:center;pointer-events:none;background:rgba(5,7,11,.55);border:1px solid var(--line);border-radius:6px;padding:.35em .9em}
.capt b{font-family:var(--f-disp);color:#ffd9d0;font-size:1.15em;margin-right:.5em}
.capt span{font-size:.88em;color:var(--fg2)}
.zbar{position:absolute;right:58px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;align-items:center;gap:4px;background:rgba(var(--panel),.82);border:1px solid var(--line2);border-radius:20px;padding:4px 6px;backdrop-filter:blur(8px);z-index:3}
.zbar button{white-space:nowrap;border:0;background:transparent;min-width:2.1em;height:2em;border-radius:14px;padding:0 .5em;font-size:.95em}
.zbar button:hover{background:rgba(255,255,255,.08)}
.zbar span{font-family:var(--f-mono);font-size:.85em;color:var(--fg2);min-width:3.4em;text-align:center}
.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 62px);transform:translateX(-50%);background:rgba(var(--panel),.94);border:1px solid var(--line2);border-radius:6px;padding:.35em .9em;font-size:.88em;color:var(--fg2);pointer-events:none;opacity:0;transition:opacity .3s;z-index:9;white-space:nowrap}
.toast.on{opacity:1}
/* ---- 邊緣大箭頭 ---- */
.edge{position:absolute;top:50%;z-index:5;width:44px;height:120px;margin-top:-60px;border:1px solid var(--line2);background:rgba(var(--panel),.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--fg);touch-action:none;box-shadow:0 6px 20px rgba(0,0,0,.35);backdrop-filter:blur(8px)}
.edge:hover{background:rgba(40,36,32,.96);color:#ffd9d0}
.edge.left{left:0;border-left:0;border-radius:0 14px 14px 0}
.edge.right{right:0;border-right:0;border-radius:14px 0 0 14px}
.edge svg{width:28px;height:28px;stroke-width:2.6}
.edge .lbl{writing-mode:vertical-rl;font-size:12px;letter-spacing:.25em;color:var(--fg2)}
.edge.dragging{cursor:grabbing}
/* ---- 面板 ---- */
.panel{position:absolute;top:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:rgba(var(--panel),var(--pa));border:1px solid var(--line2);border-radius:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;min-height:0;z-index:4;box-shadow:0 10px 34px rgba(0,0,0,.4);animation:pin .2s ease-out}
@keyframes pin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel.left{left:10px;width:calc(272px*var(--ui))}
.panel.right{right:10px;width:calc(392px*var(--ui))}
.panel.float{bottom:auto;right:auto}
.panel.max{left:10px!important;right:10px!important;top:10px!important;bottom:10px!important;width:auto!important;height:auto!important;z-index:7}
.ph{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line);flex:none;cursor:move;touch-action:none;user-select:none}
.ph h2{font-family:var(--f-disp);font-size:1.12em;margin:0;letter-spacing:.05em;flex:1;white-space:nowrap}
.ph .ib{height:32px;min-width:32px;padding:0 6px;color:var(--fg2)}
.crumb{flex:none;display:flex;align-items:center;gap:6px;padding:6px 14px;border-bottom:1px solid var(--line);font-size:.84em;color:var(--fg3);min-height:32px}
.crumb b{color:#ffd9d0;font-weight:500}
.crumb .sp{flex:1}
.crumb button{border:1px solid var(--line2);background:transparent;border-radius:5px;padding:.1em .55em;font-size:.95em;color:var(--fg2)}
.pb{overflow-y:auto;padding:10px 12px 14px;flex:1;min-height:0;scrollbar-width:thin}
.pb h3{font-size:.8em;color:var(--fg3);font-weight:500;letter-spacing:.12em;margin:14px 0 6px}
.pb h3:first-child{margin-top:2px}
.rszx{position:absolute;top:12px;bottom:12px;width:10px;cursor:ew-resize;touch-action:none}
.panel.left .rszx{right:-5px}.panel.right .rszx{left:-5px}
.rsz{position:absolute;bottom:2px;width:18px;height:18px;cursor:nwse-resize;touch-action:none;opacity:.6}
.panel.left .rsz{right:2px;cursor:nwse-resize}.panel.right .rsz{left:2px;cursor:nesw-resize}
.rsz::after{content:"";position:absolute;inset:4px;border-bottom:2px solid var(--fg3);border-right:2px solid var(--fg3)}
.panel.right .rsz::after{border-right:0;border-left:2px solid var(--fg3)}
.panel.max .rsz,.panel.max .rszx{display:none}
.vlist{display:flex;flex-direction:column;gap:2px}
.panel.max .vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.tg{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:.34em .2em;border-radius:5px;text-align:left;width:100%}
.tg:hover{background:rgba(255,255,255,.05)}
.tg i{width:2.1em;height:1.15em;border-radius:1em;background:#3a3832;position:relative;flex:none;transition:background .2s}
.tg i::after{content:"";position:absolute;top:.15em;left:.15em;width:.85em;height:.85em;border-radius:50%;background:#bdb5a7;transition:transform .2s,background .2s}
.tg[aria-pressed="true"] i{background:var(--jade)}
.tg[aria-pressed="true"] i::after{transform:translateX(.95em);background:#fff}
.tg span{flex:1;font-size:.95em}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.modes button{border:1px solid var(--line2);background:transparent;border-radius:5px;padding:.35em .2em;font-size:.9em}
.modes button[aria-pressed="true"]{background:var(--fg);color:#111;border-color:var(--fg)}
.sndrow{display:flex;align-items:center;gap:8px;margin-top:6px}
.sndrow input{flex:1;accent-color:var(--jade)}
.now{font-size:.85em;color:var(--jade);margin:6px 0 0;min-height:1.5em}
.hint{font-size:.82em;color:var(--fg3);margin:8px 0 0;line-height:1.55}
.pawg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.panel.max .pawg{grid-template-columns:repeat(6,1fr)}
.pawb{border:1px solid var(--line2);background:transparent;border-radius:6px;padding:.3em .3em;font-size:.84em;text-align:left;display:flex;gap:5px;align-items:baseline;min-width:0}
.pawb b{font-family:var(--f-mono);color:var(--amber);font-weight:600;font-size:.92em}
.pawb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pawb[aria-pressed="true"]{background:var(--amber2);border-color:var(--amber);color:#ffe2b8}
/* ---- 共用控制元件 ---- */
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
.seg button{border:0;border-left:1px solid var(--line2);background:transparent;padding:.3em .7em;font-size:.9em;line-height:1.3;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:#111}
.seg.xs button{font-size:.8em;padding:.18em .5em}
.seg.full{display:flex;width:100%}.seg.full button{flex:1}
.mseg button[data-m="auto"][aria-pressed="true"],.mseg button[data-am="auto"][aria-pressed="true"],.mseg button[data-all="auto"][aria-pressed="true"]{background:var(--jade);color:#08130f}
.mseg button[data-m="manual"][aria-pressed="true"],.mseg button[data-am="manual"][aria-pressed="true"]{background:var(--amber);color:#1a1004}
.mseg button[data-m="off"][aria-pressed="true"],.mseg button[data-am="off"][aria-pressed="true"]{background:#5c5850;color:#f3eee4}
.lab{font-size:.85em;color:var(--fg3);white-space:nowrap}
.btn{border:1px solid var(--line2);background:transparent;border-radius:5px;padding:.3em .7em;font-size:.9em;white-space:nowrap}
.btn:hover{border-color:var(--fg2)}
.btn.hl{border-color:var(--zhu);color:#ffd9d0}
.chip{border:1px solid var(--line2);background:transparent;border-radius:12px;padding:.18em .62em;font-size:.82em;white-space:nowrap}
.chip:hover{border-color:var(--fg2)}
.chip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#1a1004}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.fxl{font-size:.74em;color:var(--fg3);letter-spacing:.1em;margin:6px 0 4px}
.fxg{display:grid;grid-template-columns:repeat(auto-fill,minmax(5em,1fr));gap:4px;margin-bottom:4px}
.fxg .chip{border-radius:5px;padding:.3em .15em}
.fxd{font-size:.8em;color:var(--fg3);margin:4px 0 8px;min-height:1.3em}
.sl{display:grid;grid-template-columns:3.4em 1fr 3em;align-items:center;gap:6px;font-size:.84em;color:var(--fg2);margin:3px 0}
.sl input{width:100%;accent-color:var(--amber)}
.sl .seg{justify-self:start}
.sl b{font-family:var(--f-mono);font-weight:500;font-size:.92em;text-align:right;color:var(--fg)}
.row2{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
.row2 input[type=color]{width:2.2em;height:1.7em;border:1px solid var(--line2);border-radius:4px;padding:0;background:none;vertical-align:middle}
/* ---- 燈光方塊 ---- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-auto-flow:dense}
.panel.max .tiles{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tile{--op:1;border:1px solid var(--line2);border-radius:8px;background:rgba(255,255,255,.035);opacity:var(--op);transition:opacity .2s,border-color .2s;min-width:0;display:flex;flex-direction:column}
.tile:hover,.tile:focus-within,.tile.open{opacity:max(var(--op),.95)}
.tile.open{grid-column:1/-1;border-color:var(--zhu);box-shadow:0 0 0 1px var(--zhu2) inset}
.panel.max .tile.open{grid-column:span 2}
.t-head{border:0;background:transparent;text-align:left;padding:9px 10px 8px;display:flex;flex-direction:column;gap:4px;width:100%}
.t-name{font-family:var(--f-disp);font-weight:700;font-size:1.04em;letter-spacing:.03em;display:flex;align-items:center;gap:6px}
.t-name .chev{margin-left:auto}
.badge{font-family:var(--f-body);font-weight:500;font-size:.68em;border-radius:3px;padding:0 .4em;line-height:1.6;border:1px solid var(--line2);color:var(--fg2)}
.badge.auto{border-color:var(--jade);color:#a7e3d2}.badge.manual{border-color:var(--amber);color:#ffd59a}.badge.off{color:var(--fg3)}
.badge.now{background:var(--zhu);border-color:var(--zhu);color:#fff6f2}
.t-dots{display:flex;flex-wrap:wrap;gap:4px;min-height:12px}
.d{width:10px;height:10px;border-radius:50%;border:1px solid var(--line2);flex:none;transition:opacity .15s}
.t-body{border-top:1px solid var(--line);padding:6px 8px 10px}
.t-tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:4px 2px 8px}
.t-tools label{display:flex;align-items:center;gap:6px;font-size:.82em;color:var(--fg3)}
.t-tools input{width:5.5em;accent-color:var(--fg2)}
.qfx{display:flex;flex-wrap:wrap;gap:4px;padding:0 2px 8px}
.it{border-top:1px solid var(--line);border-radius:4px}
.it:first-of-type{border-top:0}
.it.open{background:rgba(232,165,75,.06);box-shadow:inset 3px 0 0 var(--amber)}
.it.flash{background:var(--zhu2)}
.it-r{display:flex;align-items:center;gap:6px;padding:6px 2px}
.it-h{border:0;background:transparent;display:flex;align-items:center;gap:7px;flex:1;min-width:0;text-align:left;padding:2px}
.it-n{flex:1;min-width:0;font-size:.95em;font-weight:500;line-height:1.25}
.it-n small{display:block;font-weight:400;font-size:.78em;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-fx{font-size:.78em;color:var(--amber);white-space:nowrap}
.it-fx:empty{display:none}
.chev{color:var(--fg3);font-size:.8em;transition:transform .2s;display:inline-block}
[aria-expanded="true"]>.chev,[aria-expanded="true"] .chev{transform:rotate(90deg)}
.it-b{padding:2px 6px 10px 19px}
.pgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;padding:6px 2px}
.pchip{border:1px solid var(--jade);background:var(--jade2);color:#bfeee0;font-family:var(--f-mono);font-size:.74em;padding:.2em 0;border-radius:3px}
.pchip[aria-pressed="false"]{background:transparent;color:var(--fg3);border-color:var(--line2);text-decoration:line-through}
/* ---- 浮動視窗：整體、物件設定、導覽 ---- */
.pop{position:absolute;z-index:8;background:rgba(var(--panel),.97);border:1px solid var(--line2);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.5);backdrop-filter:blur(12px);display:flex;flex-direction:column;max-height:calc(100% - 20px)}
.pop-h{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line);cursor:move;touch-action:none;user-select:none;flex:none}
.pop-h .tt{flex:1;min-width:0;font-size:.86em;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-h .tt b{font-family:var(--f-disp);font-size:1.25em;color:var(--fg);font-weight:700;margin-left:2px}
.pop-h .ib{height:30px;min-width:30px;padding:0 6px;color:var(--fg2)}
.pop-b{overflow-y:auto;padding:8px 14px 12px;min-height:0;scrollbar-width:thin}
.pop-tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 14px 2px;flex:none;scrollbar-width:none}
.pop-tabs .chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:#111}
.pop-f{display:flex;gap:8px;padding:8px 14px 12px;border-top:1px solid var(--line);flex:none;flex-wrap:wrap}
#objpop{width:min(380px,calc(100% - 20px))}
#allpop{width:min(360px,calc(100% - 20px));right:10px;top:8px}
#allpop h3{font-size:.78em;color:var(--fg3);font-weight:500;letter-spacing:.12em;margin:12px 0 6px}
#allpop h3:first-child{margin-top:4px}
.app.narrating .capt{visibility:hidden}
.narr{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));z-index:6;background:rgba(var(--panel),.95);border:1px solid var(--amber);border-radius:12px;padding:10px 14px 10px;box-shadow:0 12px 34px rgba(0,0,0,.5);backdrop-filter:blur(10px)}
.narr-h{display:flex;align-items:center;gap:8px}
.narr-no{font-family:var(--f-mono);font-size:.8em;color:var(--amber);border:1px solid var(--amber);border-radius:10px;padding:0 .55em}
.narr-h b{font-family:var(--f-disp);font-size:1.25em;flex:1}
.narr p{margin:6px 0 8px;font-size:.98em;line-height:1.7;color:var(--fg)}
.narr-f{display:flex;align-items:center;gap:8px}
.narr-f .bar{flex:1;height:3px;background:var(--line2);border-radius:2px;overflow:hidden}
.narr-f .bar i{display:block;height:100%;width:0;background:var(--amber)}
.narr .ib{height:30px;min-width:30px;padding:0 8px;color:var(--fg2);font-size:.88em}
/* focus mode */

const Z={s:1,x:0,y:0,fit:1,init:false};

function docked(k){return UI[k]&&!UI.pos[k]&&!UI.max[k];}
function viewRect(){const r=wrap.getBoundingClientRect();let l=0,rr=0;if(r.width>=980&&!app.classList.contains('focus')){if(docked('left')){const e=PN.left.el;l=e.offsetLeft+e.offsetWidth+44;}if(docked('right')){rr=r.width-PN.right.el.offsetLeft+44;}}return{w:r.width,h:r.height,l,rr};}
function layoutStage(reset){const v=viewRect(),aw=Math.max(200,v.w-v.l-v.rr),fit=Math.min(aw/W,v.h/H)*.97;if(reset||!Z.init){Z.fit=fit;Z.s=1;Z.x=v.l+(aw-W*fit)/2;Z.y=(v.h-H*fit)/2;Z.init=true;}else{const cx=v.l+aw/2,cy=v.h/2,sc0=Z.fit*Z.s,px=(cx-Z.x)/sc0,py=(cy-Z.y)/sc0;Z.fit=fit;const sc1=Z.fit*Z.s;Z.x=cx-px*sc1;Z.y=cy-py*sc1;}applyZ();}
function applyZ(){const r=wrap.getBoundingClientRect(),sc=Z.fit*Z.s,cw=W*sc,chh=H*sc,mx=Math.min(r.width*.3,cw),my=Math.min(r.height*.3,chh);Z.x=clamp(Z.x,mx-cw,r.width-mx);Z.y=clamp(Z.y,my-chh,r.height-my);cv.style.transform=`translate(${Z.x}px,${Z.y}px) scale(${sc})`;$('zpct').textContent=Math.round(Z.s*100)+'%';}
function zoomAt(f,cx,cy){const sc0=Z.fit*Z.s;Z.s=clamp(Z.s*f,.4,6);const sc1=Z.fit*Z.s;Z.x=cx-(cx-Z.x)*sc1/sc0;Z.y=cy-(cy-Z.y)*sc1/sc0;applyZ();}
function centerPt(){const v=viewRect();return[v.l+(v.w-v.l-v.rr)/2,v.h/2];}

const PTR=new Map();let drag=null,hovT=0;
wrap.addEventListener('pointerdown',e=>{try{wrap.setPointerCapture(e.pointerId);}catch(err){}PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});if(PTR.size===1)drag={x:e.clientX,y:e.clientY,zx:Z.x,zy:Z.y,moved:false};else if(PTR.size===2){const a=[...PTR.values()];drag={pinch:true,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,s:Z.s,moved:true};}});

 const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)>5){drag.moved=true;wrap.classList.add('drag');}if(drag.moved){Z.x=drag.zx+dx;Z.y=drag.zy+dy;applyZ();}});
function endPtr(e){if(!PTR.has(e.pointerId))return;PTR.delete(e.pointerId);if(PTR.size===0){if(drag&&!drag.moved&&!drag.pinch)clickAt(e.clientX,e.clientY);drag=null;wrap.classList.remove('drag');}else if(PTR.size===1){const a=[...PTR.values()][0];drag={x:a.x,y:a.y,zx:Z.x,zy:Z.y,moved:true};}}

 if(ULIB.length)h+=`<optgroup label="已匯入的音檔">${ULIB.map(u=>o('user:'+u.id,u.name)).join('')}</optgroup>`;return h;}
function winStat(){if(location.protocol!=='file:')return '目前不是以本機檔案開啟，無法直接讀取 C:\\Windows\\Media。請直接雙擊 HTML 檔開啟，或用「匯入音檔」。';
 if(!winProbed)return '尚未偵測。按「偵測本機 Windows 音效」可確認這台電腦有哪些系統音效。';const n=WINLIST.filter(([f])=>WINOK[f]).length;return n?`這台電腦找到 ${n} / ${WINLIST.length} 個 Windows 內建音效（找不到的會標示並自動改用合成音）。`:'找不到 Windows 內建音效：可能不是 Windows，或瀏覽器擋住了本機檔案。可用「匯入音檔」到 C:\\Windows\\Media 全選匯入。';}
function renderSnd(){const n=CUES.filter(f=>cueSrc(f)!=='synth').length;
 $('sndpopb').innerHTML=`<div class="chips"><button type="button" class="chip" data-sm="synth">全部用合成</button><button type="button" class="chip" data-sm="win">套用 Windows 預設對應</button><button type="button" class="chip" data-sm="off">全部靜音</button></div>
 <div class="row2"><button type="button" class="btn hl" data-sm="probe">偵測本機 Windows 音效</button><button type="button" class="btn" data-sm="import">匯入音檔…</button>${ULIB.length?`<button type="button" class="btn" data-sm="clear">清除匯入（${ULIB.length}）</button>`:''}</div>
 <p class="hint">${winStat()}</p>
 <button type="button" class="tg" data-sm="bed" aria-pressed="${SNDCFG.bed}"><i></i><span>背景環境音（風聲、蟲鳴、和聲、流水）</span></button>
 <p class="hint" style="margin-top:2px">目前 ${n} 個聲音不是用合成音。每一列可個別試聽。</p>
 <div class="cues">${CUES.map(f=>`<div class="cue${cueSrc(f)!=='synth'?' mapped':''}"><span class="cn">${CUEN[f]}<small>${cueWhere(f)}</small></span><button type="button" class="btn" data-try="${f}">▶ 試聽</button><select data-cue="${f}" aria-label="${CUEN[f]} 的音效來源">${srcOptions(cueSrc(f))}</select></div>`).join('')}</div>
 <p class="hint">Windows 內建音效是直接讀取 C:\\Windows\\Media 的 .wav 檔，所以要在 Windows 電腦上直接開啟這個 HTML 檔。若讀不到，按「匯入音檔」切到 C:\\Windows\\Media、全選匯入即可；匯入的音檔會記在這台電腦的瀏覽器裡，三個燈組網頁共用，而且能做左右聲道定位。</p>`;}
function openSnd(){renderSnd();$('sndpop').hidden=false;sndInit();decodeLib();}
function closeSnd(){$('sndpop').hidden=true;}
function tryCue(fn){sndInit();if(!SND.c){toast('此瀏覽器不支援網頁音效');return;}if(SND.c.state!=='running')SND.c.resume();if(SND.prev)SND.prev.gain.value=SND.vol;const src=cueSrc(fn);
 if(src.startsWith('win:')&&WINOK[src.slice(4)]===false)toast('找不到這個 Windows 音效，改播合成音');
 SND.pv=true;try{playCue(fn,SND.c.currentTime+.03,{x:.5,f:PENTA[3],p0:-.6,p1:.6,d:2.4},PL[0]);}catch(e){}SND.pv=false;}
$('sndpopx').addEventListener('click',closeSnd);
$('sndpopb').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.try){tryCue(b.dataset.try);return;}
 const a=b.dataset.sm;if(!a)return;
 if(a==='synth'||a==='off'){CUES.forEach(f=>{if(a==='synth')delete SNDCFG.map[f];else SNDCFG.map[f]='off';});saveSnd();renderSnd();toast(a==='synth'?'全部改回合成音效':'全部靜音');}
 else if(a==='win'){let n=0;for(const f of CUES){const w=WIN_DEF[f];if(!w)continue;const u=ULIB.find(x=>x.name.toLowerCase()===w.toLowerCase());SNDCFG.map[f]=u?'user:'+u.id:'win:'+w;n++;}saveSnd();renderSnd();toast(`已套用 ${n} 個 Windows 預設對應（動物叫聲仍用合成）`);}
 else if(a==='probe'){b.disabled=true;b.textContent='偵測中…';const n=await probeWin();renderSnd();toast(n?`找到 ${n} 個 Windows 音效`:'沒有找到 Windows 音效');}
 else if(a==='import')$('sndfile').click();
 else if(a==='clear'){await libClear();renderSnd();toast('已清除匯入的音檔');}
 else if(a==='bed'){SNDCFG.bed=!SNDCFG.bed;saveSnd();b.setAttribute('aria-pressed',String(SNDCFG.bed));}});
$('sndpopb').addEventListener('change',e=>{const s=e.target.closest('select[data-cue]');if(!s)return;const f=s.dataset.cue;if(s.value==='synth')delete SNDCFG.map[f];else SNDCFG.map[f]=s.value;saveSnd();s.closest('.cue').classList.toggle('mapped',s.value!=='synth');tryCue(f);});
$('sndfile').addEventListener('change',async e=>{const fs=[...e.target.files];e.target.value='';if(!fs.length)return;sndInit();const n=await libAdd(fs);renderSnd();toast(`匯入 ${n} 個音檔`);});

/* ================= 吉祥話：語音站互動 ================= */
let STSEL=null,TALKTOK=0,lastShowK='';
const stOf=k=>STATIONS.find(s=>s.key===k);
function placeIn(p,cx,cy){const m=mainEl.getBoundingClientRect(),w=p.offsetWidth,h=p.offsetHeight;let x=cx-m.left+26;if(x+w>m.width-8)x=cx-m.left-w-26;x=clamp(x,8,Math.max(8,m.width-w-8));const y=clamp(cy-m.top-80,8,Math.max(8,m.height-h-8));p.style.left=x+'px';p.style.top=y+'px';}
function stScreen(m){const sc=Z.fit*Z.s,r=wrap.getBoundingClientRect();return[r.left+Z.x+m.x*sc,r.top+Z.y+(m.y-70)*sc];}
function openSt(m,cx,cy){if(!m)return;closePop();openAll(false);stSeen=true;if(m.v!==view)setView(m.v);STSEL=m;renderSt();const p=$('stpop');p.hidden=false;$('hornb').setAttribute('aria-expanded','true');if(cx==null){[cx,cy]=stScreen(m);}if(innerWidth<700){p.style.left='8px';p.style.top='auto';}else placeIn(p,cx,cy);SEL={id:'mic',until:performance.now()+1600};}
function closeSt(){STSEL=null;$('stpop').hidden=true;$('hornb').setAttribute('aria-expanded','false');}
function stNowText(m){const now=performance.now();if(SHOW&&SHOW.st===m.key){const u=RT-SHOW.t0;return `光效中：${u<SHOW.tA?'初階反應':'交叉變化'}（剩 ${Math.max(0,Math.ceil(SHOW.dur-u))} 秒）`;}
 if(TALK.id===m.key&&now<TALK.until)return '遊客喊話中…辨識中';if(STFB.id===m.key&&now<STFB.until&&STFB.kind==='no')return '沒有辨識到吉祥話：燈箱跑馬燈換成提示，請再試一次';if(MIC.on&&MIC.st===m.key)return '燈柱聆聽中…';return '待命中：等遊客對祥雲燈柱喊出四字吉祥話';}
function micHint(m){if(!(MIC.on&&MIC.st===m.key))return '按「開始聆聽」並允許麥克風，就能真的對著電腦喊出吉祥話（Chrome／Edge 連網時可辨識中文）。';if(MIC.srErr)return `正在偵測音量，但這個瀏覽器目前無法辨識語音（${esc(MIC.srErr)}），可先用上面的按鈕模擬。`;return `聆聽中…${MIC.txt?`聽到：「${esc(MIC.txt)}」`:'請對著麥克風喊出四字吉祥話'}`;}
function renderSt(){const m=STSEL;if(!m)return;const off=CS.mic.mode==='off';
 $('stpoptt').innerHTML=`吉祥話 › <b>站點 ${m.no}・${m.area}</b>`;
 $('sttabs').innerHTML=STATIONS.map(s=>`<button type="button" class="chip" data-stt="${s.key}" aria-pressed="${s===m}">${s.no}・${s.area}${s.v!==view?'（'+VER.viewName[s.v]+'）':''}</button>`).join('');
 $('stpopb').innerHTML=`${off?'<p class="fxd" style="color:var(--amber)">語音站目前停用。<button type="button" class="chip" data-sact="enable">啟用</button></p>':''}
 <div class="st-t">${m.title}</div><div class="riddle">${m.q}</div>
 <h3 class="mh">四字吉祥話・點一下＝模擬遊客對燈柱喊出</h3>
 <div class="kwg">${m.pw.map((w,i)=>`<button type="button" class="kw" data-pw="${i}"><b>「${w}」</b><small>${i?'備用吉祥話':'主要吉祥話'}</small></button>`).join('')}</div>
 <div class="row2"><button type="button" class="btn" data-sact="wrong">模擬喊錯</button><button type="button" class="btn" data-sact="stop">停止光效</button></div>
 <div class="meter" aria-hidden="true"><i id="micbar"></i></div><p class="now" id="stnow">${stNowText(m)}</p>
 <h3 class="mh">光影反饋</h3><p class="fx2"><b>答對</b>燈柱響起清脆的迎賓風鈴聲，接著——<br><b>初階反應</b>${m.fxA}。<br><b>交叉變化</b>${m.fxB}。<br><b>答錯</b>燈柱亮起溫和的琥珀微光、播放雲霧沙沙聲，燈箱跑馬燈改成提示，引導再試一次。</p>
 <h3 class="mh">用電腦麥克風試試</h3><div class="row2"><button type="button" class="btn hl" data-sact="mic">${MIC.on&&MIC.st===m.key?'停止聆聽':'開始聆聽'}</button><button type="button" class="btn" data-sact="snd">音效對應…</button></div>
 <p class="hint" id="sthint">${micHint(m)}</p>
 <details class="asrd"><summary>ASRPRO 吉祥話對照（實機用）</summary><table class="spec"><thead><tr><th>站點</th><th>ASRPRO 命令詞</th><th>UART</th></tr></thead><tbody>${STATIONS.map(s=>`<tr><td>${s.no}・${s.area}</td><td>${s.asr.join('／')}</td><td><b>${s.cmd}</b></td></tr>`).join('')}<tr><td>未辨識／答錯</td><td>—</td><td><b>0x2F</b></td></tr></tbody></table><p class="hint">每站一顆 ASRPRO，兩組吉祥話設成命令詞；辨識成功由 UART 送指令給主控 Arduino Mega，切到該站的專屬光效並播放風鈴聲。逾時沒有辨識到就送 0x2F：燈柱亮琥珀微光、燈箱換提示。</p></details>`;}
const renderStIfOpen=()=>{if(STSEL&&!$('stpop').hidden)renderSt();};
function shoutPw(m,word){if(CS.mic.mode==='off'){toast('語音站目前停用');return;}sndInit();if(SND.c&&SND.c.state!=='running')SND.c.resume();if(SND.prev)SND.prev.gain.value=SND.vol;stSeen=true;if(m.v!==view)setView(m.v);
 if(NARR.i>=0)stopNarr();TALK={id:m.key,until:performance.now()+2600,lvl:.85};const tok=++TALKTOK;let fired=false;
 const done=()=>{if(fired||tok!==TALKTOK)return;fired=true;TALK.until=0;judge(m,word);};
 if(TTS&&VOICE){try{speechSynthesis.cancel();}catch(e){}const u=new SpeechSynthesisUtterance(word);u.lang='zh-TW';u.voice=VOICE;u.rate=.92;u.pitch=1.25;u.volume=1;u.onend=()=>setTimeout(done,280);u.onerror=()=>setTimeout(done,120);try{speechSynthesis.speak(u);}catch(e){}setTimeout(done,3400);}
 else{if(SND.c){SND.pv=true;try{SYN.voice(SND.c.currentTime+.02,{pan:0});}catch(e){}SND.pv=false;}setTimeout(done,1150);}
 const el=$('stnow');if(el&&STSEL===m)el.textContent=`遊客喊出：「${word}」…辨識中`;}
function judge(m,word){const w=KWN(word);if(m.pw.concat(m.asr).some(x=>w.includes(KWN(x))))correct(m,word);else wrong(m,word);}
function correct(m,word){STFB={id:m.key,kind:'ok',until:performance.now()+2500};if(SND.c){SND.pv=true;try{playCue('chime',SND.c.currentTime+.02,{pan:0},PL[0]);}catch(e){}SND.pv=false;}startShow(m);toast(`答對「${word}」→ 站點${m.no}・${m.title}`);}
function wrong(m,word){STFB={id:m.key,kind:'no',until:performance.now()+9000};if(SND.c){SND.pv=true;try{playCue('leafno',SND.c.currentTime+.02,{pan:0},PL[0]);}catch(e){}SND.pv=false;}toast(`沒有辨識到吉祥話${word?`（聽到「${word}」）`:''}，燈箱換成提示`);renderStIfOpen();}
function startShow(m){SHOW=Object.assign({},m,{st:m.key,t0:RT,ev:0});if(m.mode==='st2'&&CS.smoke.mode!=='off'){MANB.push([t,3]);MANB=MANB.filter(x=>Math.abs(t-x[0])<12);}lastSeg=null;syncTime(false);renderStIfOpen();}
function stopShow(){if(!SHOW)return;SHOW=null;showEnded();}
function showEnded(){lastSeg=null;try{syncTime(false);}catch(e){}renderStIfOpen();}
function showSnd(){if(!SHOW||!SND.c)return;const u=RT-SHOW.t0,E=STSEV[SHOW.mode]||[];while(SHOW.ev<E.length&&E[SHOW.ev][0]<=u){const e=E[SHOW.ev++];if(u-e[0]>.6)continue;SND.pv=true;try{playCue(e[1],SND.c.currentTime+.02,Object.assign({},e[2]),SHOW.pieces?SHOW.pieces[0]:PL[0]);}catch(err){}SND.pv=false;}}
const WRONGS=['我不知道','新年快樂','大家好','哈囉哈囉'];
$('stpopx').addEventListener('click',closeSt);
$('hornb').addEventListener('click',()=>{if(!$('stpop').hidden){closeSt();return;}const m=STATIONS.find(s=>s.v===view)||STATIONS[0];openSt(m);});
$('sttabs').addEventListener('click',e=>{const b=e.target.closest('[data-stt]');if(!b)return;const m=stOf(b.dataset.stt);if(m.v!==view)setView(m.v);STSEL=m;renderSt();SEL={id:'mic',until:performance.now()+1600};});
$('stpopb').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!STSEL)return;const m=STSEL;
 if(b.dataset.pw!==undefined){shoutPw(m,m.pw[+b.dataset.pw]);return;}
 const a=b.dataset.sact;
 if(a==='wrong'){const others=STATIONS.filter(s=>s!==m).map(s=>s.pw[0]);const pool=others.concat(WRONGS);shoutPw(m,pool[Math.floor(Math.random()*pool.length)]);}
 else if(a==='stop'){stopShow();toast('已停止站點光效，回到原本跑法');}
 else if(a==='enable'){CS.mic.mode='auto';save();renderSt();buildTiles();}
 else if(a==='mic')micToggle(m);
 else if(a==='snd')openSnd();});
$('stpop').querySelector('.pop-h').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const p=$('stpop'),s={x:e.clientX,y:e.clientY,l:p.offsetLeft,t:p.offsetTop};
 const mvf=ev=>{p.style.left=clamp(s.l+ev.clientX-s.x,-p.offsetWidth+80,mainEl.clientWidth-80)+'px';p.style.top=clamp(s.t+ev.clientY-s.y,0,mainEl.clientHeight-40)+'px';};const up=()=>{removeEventListener('pointermove',mvf);removeEventListener('pointerup',up);};addEventListener('pointermove',mvf);addEventListener('pointerup',up);});
$('sndpop').querySelector('.pop-h').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const p=$('sndpop'),s={x:e.clientX,y:e.clientY,l:p.offsetLeft,t:p.offsetTop};
 const mvf=ev=>{p.style.left=clamp(s.l+ev.clientX-s.x,-p.offsetWidth+80,mainEl.clientWidth-80)+'px';p.style.top=clamp(s.t+ev.clientY-s.y,0,mainEl.clientHeight-40)+'px';};const up=()=>{removeEventListener('pointermove',mvf);removeEventListener('pointerup',up);};addEventListener('pointermove',mvf);addEventListener('pointerup',up);});
/* 真的用麥克風：音量條＋語音辨識（Chrome／Edge 的 Web Speech，需連網） */
const MIC={on:false,st:null,stream:null,an:null,data:null,lvl:0,rec:null,txt:'',srErr:'',cool:0};
async function micToggle(m){if(MIC.on){const same=MIC.st===m.key;micOff();if(same){renderSt();toast('已停止聆聽');return;}}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('這個瀏覽器不能使用麥克風');return;}
 sndInit();try{if(SND.c.state!=='running')await SND.c.resume();const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});MIC.stream=st;const src=SND.c.createMediaStreamSource(st),an=SND.c.createAnalyser();an.fftSize=1024;src.connect(an);MIC.an=an;MIC.src=src;MIC.data=new Float32Array(an.fftSize);MIC.on=true;MIC.st=m.key;MIC.txt='';MIC.srErr='';}
 catch(e){toast('無法開啟麥克風：'+(e&&e.name==='NotAllowedError'?'沒有允許麥克風權限':((e&&e.name)||e)));return;}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(SR){try{const r=new SR();r.lang='zh-TW';r.continuous=true;r.interimResults=true;
   r.onresult=ev=>{let fin='',tmp='';for(let i=ev.resultIndex;i<ev.results.length;i++){const x=ev.results[i];if(x.isFinal)fin+=x[0].transcript;else tmp+=x[0].transcript;}MIC.txt=fin||tmp;const s=stOf(MIC.st);if(!s)return;const all=KWN(fin||tmp),now=performance.now();
    if(s.pw.concat(s.asr).some(w=>all.includes(KWN(w)))){if(now>MIC.cool){MIC.cool=now+4500;TALK={id:s.key,until:0,lvl:0};correct(s,fin||tmp);}}else if(fin&&KWN(fin).length>=2&&now>MIC.cool){MIC.cool=now+2500;wrong(s,fin);}
    const h=$('sthint');if(h)h.innerHTML=micHint(s);};
   r.onerror=ev=>{if(ev.error!=='no-speech'&&ev.error!=='aborted'){MIC.srErr=ev.error||'error';const h=$('sthint');if(h&&STSEL)h.innerHTML=micHint(STSEL);}};
   r.onend=()=>{if(MIC.on&&!MIC.srErr)try{r.start();}catch(e){}};r.start();MIC.rec=r;}catch(e){MIC.srErr='unsupported';}}else MIC.srErr='瀏覽器不支援';
 renderSt();toast('燈柱聆聽中：對著麥克風喊出四字吉祥話');}
function micOff(){MIC.on=false;try{MIC.stream&&MIC.stream.getTracks().forEach(t2=>t2.stop());}catch(e){}try{MIC.rec&&MIC.rec.stop();}catch(e){}MIC.rec=null;MIC.stream=null;MIC.an=null;MIC.st=null;MIC.lvl=0;}
function micTick(){if(!MIC.on||!MIC.an)return;MIC.an.getFloatTimeDomainData(MIC.data);let s=0;for(const v of MIC.data)s+=v*v;const lv=clamp((20*Math.log10(Math.sqrt(s/MIC.data.length)+1e-6)+50)/40,0,1);MIC.lvl=Math.max(lv,MIC.lvl*.88);const bar=$('micbar');if(bar)bar.style.width=(MIC.lvl*100).toFixed(0)+'%';}
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src;});}
frame(t);applyUI();buildBar();buildLeft();buildTiles();applyPanels();$('capt').hidden=!VIS.caption;setPlaying(playing);syncSnd();syncHQ();$('viewl').textContent=VER.viewName.front;
layoutStage(true);syncTime(true);draw();
Promise.all([loadImg(IMG.front),loadImg(IMG.back)]).then(imgs=>{STDIMG=imgs;buildView(VIEWS.front,imgs[0]);buildView(VIEWS.back,imgs[1]);syncTime(true);requestAnimationFrame(loop);if(UI.hq){UI.hq=false;setHQ(true);}}).catch(err=>{console.error(err);ctx.fillStyle='#e9e4d8';ctx.fillText('原稿載入失敗，請重新整理頁面',W/2,H/2+40);});

})();
